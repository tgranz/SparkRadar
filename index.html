<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SparkRadar | Track the weather like a pro for free</title>
        <link rel="icon" type="image/png" href="https://lite.sparkradar.app/assets/logo-rounded.webp" />

        <!--Metadata-->
        <meta name="og:title" content="Spark Radar | Track the weather like a pro for free." />
        <meta name="og:description" content="Because everyone experiences weather. Knowing what's coming shouldn't be a mystery." />
        <meta name="og:image" content="https://lite.sparkradar.app/assets/logo-small.webp" />
        <meta name="description" content="Because everyone experiences weather. Knowing what's coming shouldn't be a mystery." />

        <!-- MapLibre GL JS CSS -->
        <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
        <!-- MapLibre GL JS -->
        <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
        <!--Tabler Icons-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons.min.css" />
        <!-- Entry point -->
        <script type="module" src="/src/entry.js"></script>
        <!-- Onest font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">

        <!-- Style -->
        <link rel="stylesheet" href="/src/style.css" />
    </head>

    <body>
        <div id="app">
            <div id="map"></div>
            <div id="attribution">
                <span class="attribution-icon"><i class="ti ti-info-circle"></i></span>
                <span class="attribution-text">
                    &copy;
                    <a href="https://openfreemap.org/" target="_blank">OpenFreeMap</a> | 
                    <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> data from
                    <a href="https://openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>
                </span>
            </div>
            <div id="colorbar-wrapper">
                <div class="colorbar" id="colorbar-main"></div>
                <div class="colorbar hidden" id="colorbar-split"></div>
            </div>
        </div>
    </body>
</html>
